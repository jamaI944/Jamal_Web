<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jamal Web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f2f6;
            color: #111;
            min-height: 100vh;
            padding: 35px 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;
            text-align: center;
        }

        /* Logo */
        .profile {
            width: 125px;
            height: 125px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
            background: #000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        /* Name */
        h1 {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        /* Description */
        .description {
            font-size: 18px;
            color: #555;
            margin-bottom: 35px;
        }

        /* WhatsApp button */
        .link {
            width: 100%;
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;

            background: #ffffff;
            color: #111;

            text-decoration: none;

            border-radius: 15px;
            margin-bottom: 18px;

            font-size: 19px;
            font-weight: 600;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);

            transition: 0.25s ease;
        }

        .link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        /* WhatsApp icon */
        .whatsapp {
            width: 34px;
            height: 34px;
        }

        /* Footer */
        .footer {
            margin-top: 45px;
            color: #777;
            font-size: 14px;
        }

        .footer strong {
            color: #111;
        }

        /* Mobile */
        @media (max-width: 500px) {

            body {
                padding: 30px 18px;
            }

            .profile {
                width: 115px;
                height: 115px;
            }

            h1 {
                font-size: 30px;
            }

            .description {
                font-size: 16px;
            }

            .link {
                min-height: 68px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Your Jamal Web logo -->
        <img
            src="logo.png"
            alt="Jamal Web Logo"
            class="profile"
        >

        <!-- Name -->
        <h1>Jamal Web</h1>

        <!-- Description -->
        <p class="description">
            Web Design | Business | Digital
        </p>

        <!-- WhatsApp -->
        <a
            class="link"
            href="https://wa.me/212627215758"
            target="_blank"
            rel="noopener noreferrer"
        >

            <svg
                class="whatsapp"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
            >

                <path
                    fill="#25D366"
                    d="M12 2C6.48 2 2 6.48 2 12c0 1.76.46 3.41 1.32 4.83L2 22l5.3-1.35C8.69 21.5 10.3 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"
                />

                <path
                    fill="#fff"
                    d="M16.55 13.95c-.25-.13-1.47-.73-1.69-.82-.22-.08-.38-.12-.54.13-.16.25-.62.82-.75.98-.13.17-.27.19-.52.06-.25-.13-1.05-.39-2-.95-.74-.66-1.24-1.47-1.38-1.72-.13-.25-.02-.39.1-.52.12-.12.25-.31.37-.46.13-.16.17-.27.25-.44.08-.16.04-.3-.02-.43-.06-.13-.56-1.35-.77-1.85-.21-.48-.42-.42-.57-.43h-.46c-.16 0-.42.06-.64.3-.22.25-.84.83-.84 2.04s.86 2.38.98 2.54c.13.16 1.69 2.58 4.09 3.62.57.25 1.01.4 1.35.51.57.18 1.09.15 1.5.09.46-.07 1.42-.58 1.62-1.14.2-.55.2-1.03.14-1.13-.05-.03-.11-.05-.24-.12z"
                />

            </svg>

            WhatsApp
        </a>

        <div class="footer">
            © 2026 <strong>Jamal Web</strong>
        </div>

    </div>

</body>
</html>
